<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurar GestorVend</title>
    <style>
      :root {
        --navy: #142159;
        --navy-2: #1b2d78;
        --accent: #4ade9f;
        --ink: #0b3b2b;
        --bg: #f1f5f9;
        --surface: #fff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --danger: #b91c1c;
        --danger-bg: #fee2e2;
        --radius: 12px;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, var(--navy) 0%, var(--navy-2) 100%);
        color: var(--text);
        padding: 1.5rem;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border-radius: 16px;
        padding: 2rem 1.75rem;
        box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        font-weight: 800;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        padding: 0.7rem 0.85rem;
        border: 1px solid #cbd5e1;
        border-radius: var(--radius);
        font: inherit;
        margin-bottom: 1rem;
      }
      input:focus {
        outline: 2px solid var(--navy-2);
        outline-offset: 1px;
      }
      button {
        width: 100%;
        padding: 0.8rem 1rem;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--ink);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .error {
        background: var(--danger-bg);
        color: var(--danger);
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius);
        font-size: 0.88rem;
        margin-bottom: 0.85rem;
        display: none;
      }
      .error.show { display: block; }
      .hint { font-size: 0.8rem; color: var(--muted); margin-top: -0.55rem; margin-bottom: 1rem; }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 1.25rem;
      }
      .brand img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 8px 22px rgba(20, 33, 89, 0.28);
        margin-bottom: 0.85rem;
      }
      .brand h1 { margin: 0 0 0.35rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="logo.png" alt="GestorVend" width="72" height="72" />
        <h1>Configurar GestorVend</h1>
      </div>
      <p>Informe o endereço do servidor e a abreviatura da empresa. A licença será validada antes de abrir o sistema.</p>
      <div id="error" class="error"></div>
      <form id="form">
        <label for="serverUrl">URL do servidor</label>
        <input id="serverUrl" type="url" required placeholder="https://loja.exemplo.com" autocomplete="url" />
        <div class="hint">Mesmo endereço do sistema (onde você faz login). Não use o site institucional gestorvend.com. Em desenvolvimento local: http://127.0.0.1:5173</div>
        <label for="tenantSlug">Abreviatura da empresa</label>
        <input id="tenantSlug" type="text" required minlength="2" maxlength="64" placeholder="ex.: demo" autocomplete="organization" />
        <button type="submit" id="submit">Salvar e entrar</button>
      </form>
    </div>
    <script>
      const form = document.getElementById('form');
      const err = document.getElementById('error');
      const btn = document.getElementById('submit');

      window.gestorvend.getConfig().then((cfg) => {
        if (!cfg) return;
        document.getElementById('serverUrl').value = cfg.serverUrl || '';
        document.getElementById('tenantSlug').value = cfg.tenantSlug || '';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Validando…';
        const result = await window.gestorvend.saveConfig({
          serverUrl: document.getElementById('serverUrl').value.trim(),
          tenantSlug: document.getElementById('tenantSlug').value.trim(),
        });
        if (!result.ok) {
          err.textContent = result.error || 'Não foi possível salvar.';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Salvar e entrar';
        }
      });
    </script>
  </body>
</html>
